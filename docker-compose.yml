version: '3.8'

services:
  auth-service:
    build:
      context: ./backend/auth-service
    ports:
      - "5001:5000"
    networks:
      - app-network

  weather-service:
    build:
      context: ./backend/weather-service
    ports:
      - "5002:5000"
    networks:
      - app-network

  calendar-service:
    build:
      context: ./backend/calendar-service
    ports:
      - "5003:5000"
    networks:
      - app-network

  nginx:
    build:
      context: ./backend/nginx
    ports:
      - "80:80"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
